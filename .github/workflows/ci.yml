name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: back-to-back merges would leave the earlier merge
  # commit permanently unverified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run i18n:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: porta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/porta_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: porta_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/porta_e2e
    steps:
      - uses: actions/checkout@v4
      # bun run respects the node shebang in next's bin: without this the
      # build/server run on the runner's default Node, not the Node 24 that
      # engines and the Docker runtime pin.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # test:e2e runs a full `next build`; cache Next's incremental build
      # cache so it isn't cold every run. The restore-keys fallback reuses the
      # newest cache for the same deps even when source changed (the point of
      # an incremental cache), while the source hash keeps the exact key fresh.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'messages/*.json', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    env:
      # Compose interpolates the required variable even for `build`.
      BETTER_AUTH_SECRET: ci-smoke-only-secret-not-production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Boot the stack and smoke-test it
        run: |
          docker compose up -d
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS \
            http://localhost:3000/en > /dev/null
          echo "compose stack serves /en"
          curl -fsS http://localhost:3000/api/health | grep -q '"ok"'
          echo "health route serves ok"
          # The image's HEALTHCHECK must actually flip the container to healthy.
          cid=$(docker compose ps -q app)
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && exit 1
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' "$cid")" = "healthy" ]
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
